
<header class="header">
  <div class="header__container">

    <!-- Logotipo principal -->
    <a
      href="index.html"
      class="header__logo"
      aria-label="CODEL - Ir al inicio"
    >
      <img
        src="assets/logo.png"
        alt="CODEL - Todo para tu hogar"
        class="header__logo-img"
        loading="eager"
        decoding="async"
      >
    </a>

    <!-- Control del menú móvil -->
    <input
      type="checkbox"
      id="menu-toggle"
      class="header__menu-checkbox"
    >

    <label
      for="menu-toggle"
      class="header__menu-button"
      aria-label="Abrir menú de navegación"
    >
      <span></span>
      <span></span>
      <span></span>
    </label>

    <!-- Navegación principal -->
    <nav
      class="header__nav"
      aria-label="Navegación principal"
    >
      <ul class="header__menu">

        <!-- Inicio -->
        <li>
          <a
            href="index.html"
            class="header__link active"
          >
            Inicio
          </a>
        </li>

        <!-- Productos -->
        <li>
          <a
            href="productos.html"
            class="header__link"
          >
            Productos
          </a>
        </li>

        <!-- Promociones -->
        <li>
          <a
            href="promociones.html"
            class="header__link"
          >
            Promociones
          </a>
        </li>

        <!-- Financiamiento -->
        <li>
          <a
            href="financiamiento.html"
            class="header__link"
          >
            Financiamiento
          </a>
        </li>

        <!-- Catálogo digital -->
        <li>
          <a
            href="CatalogoDigital.html"
            class="header__link"
          >
            Catálogo Digital
          </a>
        </li>

      </ul>
    </nav>

    <!-- Botón de WhatsApp -->
    <a
      href="https://wa.me/50578728585?text=Hola%2C%20deseo%20cotizar%20un%20producto%20de%20CODEL."
      target="_blank"
      rel="noopener noreferrer"
      class="header__cta"
    >
      Cotiza ahora
    </a>

  </div>
</header>
